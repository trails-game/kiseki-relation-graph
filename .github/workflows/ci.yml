name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Validate & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: PHP syntax check
        run: |
          find wp-plugin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate graph dataset & topology
        run: python3 tools/validate_dataset.py

      - name: Build standalone web app
        run: npm run build

      - name: Build & package WordPress plugin
        run: |
          npm run build:wp
          python3 tools/package_plugin.py
